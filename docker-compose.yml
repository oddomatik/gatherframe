services:
  app:
    image: ${GATHERFRAME_IMAGE:-gatherframe:local}
    build: .
    restart: unless-stopped
    init: true
    stop_grace_period: 60s
    deploy:
      replicas: 1
      update_config:
        order: stop-first
      rollback_config:
        order: stop-first
    environment:
      NODE_ENV: production
      DATA_DIR: /data
      APP_SECRET: ${APP_SECRET:?Generate .env with node scripts/init-env.mjs}
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:-http://localhost:3000}
      ORIGIN: ${PUBLIC_ORIGIN:-http://localhost:3000}
      SETUP_ENABLED: ${SETUP_ENABLED:-0}
      GOTIFY_ALLOW_PRIVATE: ${GOTIFY_ALLOW_PRIVATE:-0}
      BODY_SIZE_LIMIT: Infinity
      MAX_UPLOAD_BYTES: ${MAX_UPLOAD_BYTES:-4294967296}
      B2_ENDPOINT: ${B2_ENDPOINT:-}
      B2_REGION: ${B2_REGION:-}
      B2_BUCKET: ${B2_BUCKET:-}
      B2_KEY_ID: ${B2_KEY_ID:-}
      B2_APPLICATION_KEY: ${B2_APPLICATION_KEY:-}
      B2_PREFIX: ${B2_PREFIX:-picture-day}
      STORAGE_MIN_FREE_BYTES: ${STORAGE_MIN_FREE_BYTES:-268435456}
      STORAGE_MATERIALIZE_CONCURRENCY: ${STORAGE_MATERIALIZE_CONCURRENCY:-2}
      ZIP_CACHE_MAX_BYTES: ${ZIP_CACHE_MAX_BYTES:-21474836480}
      TZ: ${TZ:-UTC}
    volumes:
      - picture_day_data:/data
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${PORT:-3000}:3000"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    profiles: [tls]
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:-photos.example.com}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  picture_day_data:
  caddy_data:
  caddy_config:
